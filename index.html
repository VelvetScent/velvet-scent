<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fashion Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .cart-button {
      background: white;
      color: #111;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 26px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-description {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      background: #111;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn:hover {
      background: #333;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
      grid-column: 1 / -1;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 2000;
    }

    .cart {
      position: fixed;
      top: 0;
      right: -450px;
      width: 430px;
      max-width: 95%;
      height: 100%;
      background: white;
      z-index: 3000;
      transition: .3s;
      padding: 20px;
      overflow-y: auto;
    }

    .cart.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-cart {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .cart-item img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-info {
      flex: 1;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity button {
      width: 28px;
      height: 28px;
      border: none;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove {
      color: #c00;
      border: none;
      background: none;
      cursor: pointer;
      margin-top: 5px;
    }

    .cart-total {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
      padding-top: 15px;
      border-top: 2px solid #111;
    }

    .order-form {
      display: none;
      margin-top: 25px;
    }

    .order-form h3 {
      margin-bottom: 15px;
    }

    .order-form input,
    .order-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .order-form textarea {
      height: 90px;
      resize: none;
    }

    .whatsapp-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .products {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .product img {
        height: 190px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 15px;
      }

      .price {
        font-size: 16px;
      }

      .cart {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Fashion Store</h1>

  <button class="cart-button" onclick="openCart()">
    🛒 السلة (<span id="cartCount">0</span>)
  </button>
</header>

<main class="container">

  <h2 class="section-title">👜 شنط حريمي</h2>

  <div id="products" class="products">
    <div class="empty">جاري تحميل المنتجات...</div>
  </div>

</main>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<div id="cart" class="cart">

  <div class="cart-header">
    <h2>🛒 سلة المشتريات</h2>

    <button class="close-cart" onclick="closeCart()">
      ×
    </button>
  </div>

  <div id="cartItems"></div>

  <div class="cart-total">
    الإجمالي:
    <span id="cartTotal">0</span>
    جنيه
  </div>

  <div class="order-form" id="orderForm">

    <h3>بيانات الطلب</h3>

    <input
      type="text"
      id="customerName"
      placeholder="الاسم"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="رقم الموبايل"
    >

    <textarea
      id="customerAddress"
      placeholder="العنوان بالتفصيل"
    ></textarea>

    <button
      class="whatsapp-btn"
      onclick="sendOrder()"
    >
      📱 إرسال الطلب عبر WhatsApp
    </button>

  </div>

</div>

<footer>
  <p>©️ 2026 Fashion Store - جميع الحقوق محفوظة</p>
</footer>

<script>

  // ============================
  // SUPABASE
  // ============================

  const SUPABASE_URL =
    "https://frvgjkeeaojyvwsjikre.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_aPftd5l28afljdgY2ddn9A_2HPnFF3E";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ============================
  // STORAGE
  // ============================

  const IMAGE_BUCKET =
    "product-images";


  // ============================
  // WHATSAPP
  // ============================

  const STORE_WHATSAPP =
    "201064014838";


  // ============================
  // DATA
  // ============================

  let products = [];
  let cart = [];


  // ============================
  // GET IMAGE URL
  // ============================

  function getImageUrl(image) {

    if (!image) {
      return "";
    }

    // لو الصورة بالفعل رابط كامل
    if (
      image.startsWith("http://") ||
      image.startsWith("https://")
    ) {
      return image;
    }

    // لو الصورة اسم ملف موجود في Storage
    const { data } =
      supabaseClient.storage
        .from(IMAGE_BUCKET)
        .getPublicUrl(image);

    return data.publicUrl;
  }


  // ============================
  // LOAD PRODUCTS
  // ============================

  async function loadProducts() {

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("id", {
          ascending: true
        });

    if (error) {

      console.error(
        "Supabase Error:",
        error
      );

      const container =
        document.getElementById("products");

      container.innerHTML =
        '<div class="empty">حدث خطأ في تحميل المنتجات</div>';

      return;
    }

    products = data || [];

    renderProducts();
  }


  // ============================
  // PRODUCTS
  // ============================

  function renderProducts() {

    const container =
      document.getElementById("products");

    if (!products.length) {

      container.innerHTML =
        '<div class="empty">لا توجد منتجات حاليًا</div>';

      return;
    }

    container.innerHTML =
      products.map(product => {

        const imageUrl =
          getImageUrl(product.image);

        return `
          <div class="product">

            <img
              src="${escapeHTML(imageUrl)}"
              alt="${escapeHTML(product.name)}"
              onerror="this.style.display='none'"
            >

            <div class="product-info">

              <div class="product-name">
                ${escapeHTML(product.name)}
              </div>

              <div class="product-description">
                ${escapeHTML(
                  product.description || ""
                )}
              </div>

              <div class="price">
                ${Number(
                  product.price
                ).toLocaleString("ar-EG")}
                جنيه
              </div>

              <button
                class="add-btn"
                onclick="addToCart(${product.id})"
              >
                أضف للسلة
              </button>

            </div>

          </div>
        `;

      }).join("");
  }


  // ============================
  // ADD TO CART
  // ============================

  function addToCart(id) {

    const product =
      products.find(
        p => p.id === id
      );

    if (!product) return;

    const existing =
      cart.find(
        item => item.id === id
      );

    if (existing) {

      if (
        product.stock &&
        existing.quantity >=
        Number(product.stock)
      ) {

        alert(
          "الكمية المتاحة خلصت"
        );

        return;
      }

      existing.quantity++;

    } else {

      cart.push({
        ...product,
        quantity: 1
      });

    }

    updateCart();

    alert(
      "تمت إضافة المنتج للسلة 🛒"
    );
  }


  // ============================
  // QUANTITY
  // ============================

  function increaseQuantity(id) {

    const item =
      cart.find(
        item => item.id === id
      );

    if (!item) return;

    if (
      item.stock &&
      item.quantity >=
      Number(item.stock)
    ) {

      alert(
        "الكمية المتاحة خلصت"
      );

      return;
    }

    item.quantity++;

    updateCart();
  }


  function decreaseQuantity(id) {

    const item =
      cart.find(
        item => item.id === id
      );

    if (!item) return;

    item.quantity--;

    if (item.quantity <= 0) {

      cart =
        cart.filter(
          item => item.id !== id
        );

    }

    updateCart();
  }


  function removeFromCart(id) {

    cart =
      cart.filter(
        item => item.id !== id
      );

    updateCart();
  }


  // ============================
  // UPDATE CART
  // ============================

  function updateCart() {

    const cartItems =
      document.getElementById(
        "cartItems"
      );

    const cartCount =
      document.getElementById(
        "cartCount"
      );

    const cartTotal =
      document.getElementById(
        "cartTotal"
      );

    const orderForm =
      document.getElementById(
        "orderForm"
      );

    const count =
      cart.reduce(
        (sum, item) =>
          sum + item.quantity,
        0
      );

    const total =
      cart.reduce(
        (sum, item) =>
          sum +
          Number(item.price) *
          item.quantity,
        0
      );

    cartCount.textContent =
      count;

    cartTotal.textContent =
      total.toLocaleString(
        "ar-EG"
      );

    if (!cart.length) {

      cartItems.innerHTML =
        '<div class="empty">السلة فارغة 🛒</div>';

      orderForm.style.display =
        "none";

      return;
    }

    orderForm.style.display =
      "block";

    cartItems.innerHTML =
      cart.map(item => {

        return `
          <div class="cart-item">

            <img
              src="${escapeHTML(
                getImageUrl(item.image)
              )}"
              alt="${escapeHTML(
                item.name
              )}"
            >

            <div class="cart-item-info">

              <strong>
                ${escapeHTML(
                  item.name
                )}
              </strong>

              <div>
                ${Number(
                  item.price
                ).toLocaleString(
                  "ar-EG"
                )}
                جنيه
              </div>

              <div class="quantity">

                <button
                  onclick="decreaseQuantity(
                    ${item.id}
                  )"
                >
                  -
                </button>

                <span>
                  ${item.quantity}
                </span>

                <button
                  onclick="increaseQuantity(
                    ${item.id}
                  )"
                >
                  +
                </button>

              </div>

              <button
                class="remove"
                onclick="removeFromCart(
                  ${item.id}
                )"
              >
                حذف
              </button>

            </div>

          </div>
        `;

      }).join("");
  }


  // ============================
  // OPEN CART
  // ============================

  function openCart() {

    document
      .getElementById("cart")
      .classList.add("open");

    document
      .getElementById("overlay")
      .style.display =
      "block";

    updateCart();
  }


  // ============================
  // CLOSE CART
  // ============================

  function closeCart() {

    document
      .getElementById("cart")
      .classList.remove("open");

    document
      .getElementById("overlay")
      .style.display =
      "none";
  }


  // ============================
  // WHATSAPP
  // ============================

  function sendOrder() {

    if (!cart.length) {

      alert(
        "السلة فارغة"
      );

      return;
    }

    const name =
      document
        .getElementById(
          "customerName"
        )
        .value
        .trim();

    const phone =
      document
        .getElementById(
          "customerPhone"
        )
        .value
        .trim();

    const address =
      document
        .getElementById(
          "customerAddress"
        )
        .value
        .trim();

    if (
      !name ||
      !phone ||
      !address
    ) {

      alert(
        "من فضلك املأ جميع بيانات الطلب"
      );

      return;
    }

    const total =
      cart.reduce(
        (sum, item) =>
          sum +
          Number(item.price) *
          item.quantity,
        0
      );

    let message =
      "🛍️ طلب جديد من Fashion Store\n\n";

    message +=
      "👤 الاسم: " +
      name +
      "\n";

    message +=
      "📱 الموبايل: " +
      phone +
      "\n";

    message +=
      "📍 العنوان: " +
      address +
      "\n\n";

    message +=
      "🛒 المنتجات:\n";

    cart.forEach(item => {

      message +=
        "• " +
        item.name +
        " × " +
        item.quantity +
        " = " +
        (
          Number(item.price) *
          item.quantity
        ) +
        " جنيه\n";

    });

    message +=
      "\n💰 الإجمالي: " +
      total +
      " جنيه";

    const whatsappURL =
      "https://wa.me/" +
      STORE_WHATSAPP +
      "?text=" +
      encodeURIComponent(
        message
      );

    window.open(
      whatsappURL,
      "_blank"
    );
  }


  // ============================
  // ESCAPE HTML
  // ============================

  function escapeHTML(value) {

    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }


  // ============================
  // START
  // ============================

  loadProducts();

</script>

</body>
</html>
