<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://frvgjkeeaojyvwsjikre.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aPftd5l28afljdgY2ddn9A_2HPnFF3E";

const STORE_WHATSAPP =
"201092460908";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
DATA
========================= */

let products = [];
let cart = [];
let currentCategory = "all";


/* =========================
LOADER
========================= */

window.addEventListener("load", function(){

setTimeout(function(){

const loader =
document.getElementById("loader");

if(loader){
loader.classList.add("hide");
}

},800);

});


/* =========================
HEADER
========================= */

window.addEventListener("scroll",function(){

const header =
document.getElementById("header");

if(!header)return;

if(window.scrollY > 40){

header.classList.add("scrolled");

}else{

header.classList.remove("scrolled");

}

});


/* =========================
FILTER
========================= */

function filterProducts(category,button){

currentCategory = category;

document
.querySelectorAll(".category-btn")
.forEach(function(btn){

btn.classList.remove("active");

});

if(button){

button.classList.add("active");

}

renderProducts();

}


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

const container =
document.getElementById("products");

if(!container)return;

container.innerHTML = `
<div class="empty">
جاري تحميل العطور...
</div>
`;

const {data,error} =
await supabaseClient
.from("products")
.select(`
product_id,
name,
price,
image,
description,
stock,
category,
option1_name,
option1_price,
option2_name,
option2_price,
option3_name,
option3_price
`)
.order("product_id",{ascending:false});


if(error){

console.error(error);

container.innerHTML = `
<div class="error-box">
<strong>حدث خطأ في تحميل العطور</strong>
<br><br>
${escapeHTML(error.message)}
</div>
`;

return;

}

products = data || [];

renderProducts();

}


/* =========================
PRODUCT OPTIONS
========================= */

function getProductOptions(product){

const options = [];


/* OPTION 1 */

const option1Name =
String(product.option1_name || "").trim();

const option1Price =
Number(product.option1_price);

if(
option1Name &&
Number.isFinite(option1Price) &&
option1Price > 0
){

options.push({

name:option1Name,
price:option1Price,
originalIndex:0

});

}


/* OPTION 2 */

const option2Name =
String(product.option2_name || "").trim();

const option2Price =
Number(product.option2_price);

if(
option2Name &&
Number.isFinite(option2Price) &&
option2Price > 0
){

options.push({

name:option2Name,
price:option2Price,
originalIndex:1

});

}


/* OPTION 3 */

const option3Name =
String(product.option3_name || "").trim();

const option3Price =
Number(product.option3_price);

if(
option3Name &&
Number.isFinite(option3Price) &&
option3Price > 0
){

options.push({

name:option3Name,
price:option3Price,
originalIndex:2

});

}

return options;

}


/* =========================
RENDER PRODUCTS
========================= */

function renderProducts(){

const container =
document.getElementById("products");

if(!container)return;

let filtered = products;

if(currentCategory !== "all"){

filtered =
products.filter(function(product){

return String(
product.category || ""
).toLowerCase() ===
currentCategory;

});

}


if(!filtered.length){

container.innerHTML = `
<div class="empty">
لا توجد عطور في هذا القسم حاليًا.
</div>
`;

return;

}


container.innerHTML =
filtered.map(function(product,index){

const options =
getProductOptions(product);

const productId =
String(product.product_id);

let sizesHTML = "";


if(options.length){

sizesHTML = `

<div class="size-title">
اختر الحجم:
</div>

<div class="size-options">

${
options.map(function(option,optionIndex){

const safeId =
"product_" +
productId +
"_option_" +
optionIndex;

return `

<div class="size-option">

<input
type="radio"
name="size_${escapeAttribute(productId)}"
id="${escapeAttribute(safeId)}"
value="${optionIndex}"
onchange="updateSelectedPrice('${escapeAttribute(productId)}',${optionIndex})"
${optionIndex === 0 ? "checked" : ""}
>

<label for="${escapeAttribute(safeId)}">
${escapeHTML(option.name)}
</label>

</div>

`;

}).join("")
}

</div>

<div
id="selected-price-${escapeAttribute(productId)}"
class="selected-price"
>
${options[0].price.toLocaleString("ar-EG")}
جنيه
</div>

<button
class="add-btn"
onclick="addProductToCart('${escapeAttribute(productId)}')"
>
أضف للسلة 🛍️
</button>

`;

}else{

sizesHTML = `
<div class="selected-price">
السعر غير متاح
</div>
`;

}


return `

<div class="product">

<div class="product-image">

${
index < 3
?
`
<div class="product-tag">
NEW
</div>
`
:
""
}

<img
src="${escapeAttribute(product.image || "")}"
alt="${escapeAttribute(product.name || "")}"
onerror="this.style.display='none';"
>

</div>

<div class="product-info">

<div class="product-name">
${escapeHTML(product.name || "عطر")}
</div>

<div class="product-description">
${escapeHTML(product.description || "")}
</div>

${sizesHTML}

</div>

</div>

`;

}).join("");

}


/* =========================
UPDATE SELECTED PRICE
========================= */

function updateSelectedPrice(productId,optionIndex){

const product =
products.find(function(p){

return String(p.product_id) ===
String(productId);

});

if(!product)return;

const options =
getProductOptions(product);

const option =
options[optionIndex];

if(!option)return;

const priceElement =
document.getElementById(
"selected-price-" + productId
);

if(priceElement){

priceElement.textContent =
option.price.toLocaleString("ar-EG") +
" جنيه";

}

}


/* =========================
ADD TO CART
========================= */

function addProductToCart(productId){

const product =
products.find(function(p){

return String(p.product_id) ===
String(productId);

});

if(!product){

alert("العطر غير موجود");

return;

}


const options =
getProductOptions(product);

if(!options.length){

alert("لا توجد أسعار متاحة لهذا العطر");

return;

}


const selected =
document.querySelector(
`input[name="size_${CSS.escape(String(productId))}"]:checked`
);

if(!selected){

alert("اختار الحجم الأول");

return;

}


const optionIndex =
Number(selected.value);

const option =
options[optionIndex];

if(!option){

alert("اختيار غير صحيح");

return;

}


const existing =
cart.find(function(item){

return (
String(item.productId) ===
String(productId) &&
item.optionName ===
option.name
);

});


if(existing){

if(
product.stock > 0 &&
existing.quantity >=
Number(product.stock)
){

alert("الكمية المتاحة خلصت");

return;

}

existing.quantity++;

}else{

cart.push({

productId:productId,

name:product.name,

image:product.image,

description:product.description,

optionName:option.name,

price:option.price,

quantity:1,

stock:Number(product.stock || 0)

});

}


updateCart();

openCart();

}


/* =========================
INCREASE
========================= */

function increaseQuantity(productId,optionName){

const item =
cart.find(function(item){

return (
String(item.productId) ===
String(productId) &&
item.optionName ===
optionName
);

});

if(!item)return;


if(
item.stock > 0 &&
item.quantity >= item.stock
){

alert("الكمية المتاحة خلصت");

return;

}


item.quantity++;

updateCart();

}


/* =========================
DECREASE
========================= */

function decreaseQuantity(productId,optionName){

const item =
cart.find(function(item){

return (
String(item.productId) ===
String(productId) &&
item.optionName ===
optionName
);

});

if(!item)return;

item.quantity--;

if(item.quantity <= 0){

cart =
cart.filter(function(cartItem){

return !(
String(cartItem.productId) ===
String(productId) &&
cartItem.optionName ===
optionName
);

});

}

updateCart();

}


/* =========================
REMOVE
========================= */

function removeFromCart(productId,optionName){

cart =
cart.filter(function(item){

return !(
String(item.productId) ===
String(productId) &&
item.optionName ===
optionName
);

});

updateCart();

}


/* =========================
UPDATE CART
========================= */

function updateCart(){

const cartItems =
document.getElementById("cartItems");

const cartCount =
document.getElementById("cartCount");

const cartTotal =
document.getElementById("cartTotal");

const orderForm =
document.getElementById("orderForm");


if(!cartItems)return;


const count =
cart.reduce(function(sum,item){

return sum + item.quantity;

},0);


const total =
cart.reduce(function(sum,item){

return sum +
Number(item.price || 0) *
item.quantity;

},0);


cartCount.textContent = count;

cartTotal.textContent =
total.toLocaleString("ar-EG");


if(!cart.length){

cartItems.innerHTML = `
<div class="empty">
السلة فارغة 🛍️
</div>
`;

orderForm.style.display = "none";

return;

}


orderForm.style.display = "block";


cartItems.innerHTML =
cart.map(function(item){

return `

<div class="cart-item">

<img
src="${escapeAttribute(item.image || "")}"
alt="${escapeAttribute(item.name || "")}"
>

<div class="cart-item-info">

<strong>
${escapeHTML(item.name || "عطر")}
</strong>

<div class="cart-size">
الحجم:
${escapeHTML(item.optionName)}
</div>

<div>
${Number(item.price || 0).toLocaleString("ar-EG")}
جنيه
</div>

<div class="quantity">

<button
onclick="decreaseQuantity('${escapeAttribute(String(item.productId))}','${escapeAttribute(item.optionName)}')"
>
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="increaseQuantity('${escapeAttribute(String(item.productId))}','${escapeAttribute(item.optionName)}')"
>
+
</button>

</div>

<button
class="remove"
onclick="removeFromCart('${escapeAttribute(String(item.productId))}','${escapeAttribute(item.optionName)}')"
>
حذف
</button>

</div>

</div>

`;

}).join("");

}


/* =========================
OPEN CART
========================= */

function openCart(){

const cartElement =
document.getElementById("cart");

const overlay =
document.getElementById("overlay");

if(cartElement){

cartElement.classList.add("open");

}

if(overlay){

overlay.style.display = "block";

}

updateCart();

}


/* =========================
CLOSE CART
========================= */

function closeCart(){

const cartElement =
document.getElementById("cart");

const overlay =
document.getElementById("overlay");

if(cartElement){

cartElement.classList.remove("open");

}

if(overlay){

overlay.style.display = "none";

}

}


/* ==================================================
SEND ORDER
================================================== */

async function sendOrder(){

if(!cart.length){

alert("السلة فارغة");

return;

}


const name =
document
.getElementById("customerName")
.value
.trim();


const phone =
document
.getElementById("customerPhone")
.value
.trim();


const address =
document
.getElementById("customerAddress")
.value
.trim();


if(!name || !phone || !address){

alert(
"من فضلك املأ جميع بيانات الطلب"
);

return;

}


/* =========================
TOTAL
========================= */

const total =
cart.reduce(function(sum,item){

return sum +
Number(item.price || 0) *
item.quantity;

},0);


/* =========================
ITEMS
========================= */

const orderItems =
cart.map(function(item){

return {

product_id:item.productId,

name:item.name,

optionName:item.optionName,

price:Number(item.price || 0),

quantity:Number(item.quantity || 1)

};

});


/* =========================
SAVE ORDER
========================= */

/*
مهم:
هنا لا نستخدم .select().single()
حتى لا يحتاج الزائر إلى SELECT policy.
*/

const {error} =
await supabaseClient
.from("orders")
.insert({

customer_name:name,

customer_phone:phone,

customer_address:address,

total:total,

status:"new",

items:orderItems

});


/* =========================
ERROR
========================= */

if(error){

console.error(
"ORDER ERROR:",
error
);

alert(
"حصل خطأ أثناء حفظ الطلب:\n\n" +
error.message
);

return;

}


/* =========================
WHATSAPP
========================= */

let message =
"🖤 طلب جديد من Velvet Scent\n\n";


message +=
"👤 الاسم: " +
name +
"\n";


message +=
"📱 الموبايل: " +
phone +
"\n";


message +=
"📍 العنوان: " +
address +
"\n\n";


message +=
"🌹 العطور:\n";


cart.forEach(function(item){

message +=
"• " +
item.name +
" — " +
item.optionName +
" × " +
item.quantity +
" = " +
(
Number(item.price || 0) *
item.quantity
) +
" جنيه\n";

});


message +=
"\n💰 الإجمالي: " +
total +
" جنيه";


const whatsappURL =
"https://wa.me/" +
STORE_WHATSAPP +
"?text=" +
encodeURIComponent(message);


/* =========================
OPEN WHATSAPP
========================= */

window.open(
whatsappURL,
"_blank"
);


/* =========================
CLEAR
========================= */

cart = [];

updateCart();

closeCart();


alert(
"تم تسجيل الطلب بنجاح ✅\n\n" +
"سيتم تأكيد الطلب عبر WhatsApp."
);

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return escapeHTML(value);

}


/* =========================
START
========================= */

loadProducts();

</script>
