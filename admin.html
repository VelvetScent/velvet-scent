<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Velvet Scent | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Cairo", Arial, sans-serif;
      background: #f5f1e9;
      color: #171513;
      padding: 20px;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #11100f;
      color: white;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      letter-spacing: 4px;
      font-size: 32px;
    }

    header p {
      color: #c9a45c;
      margin-top: 5px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    h2 {
      margin-bottom: 18px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      background: #11100f;
      color: white;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .gold {
      background: #c9a45c;
      color: #111;
    }

    .red {
      background: #b00000;
    }

    .gray {
      background: #777;
    }

    .logout {
      background: #b00000;
    }

    #adminPanel {
      display: none;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
    }

    .success {
      color: #16823b;
    }

    .error {
      color: #b00000;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      gap: 15px;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 15px;
      align-items: start;
    }

    .product img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-info {
      color: #666;
      line-height: 1.9;
    }

    .category {
      display: inline-block;
      background: #111;
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
      margin: 0;
    }

    .edit-box {
      display: none;
      background: #faf8f3;
      border: 1px solid #e5ddce;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .edit-box.show {
      display: block;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .count {
      color: #777;
      margin-bottom: 15px;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .container {
        width: 100%;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .product {
        grid-template-columns: 75px 1fr;
      }

      .product img {
        width: 75px;
        height: 75px;
      }

      .product-name {
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>VELVET SCENT</h1>
    <p>Luxury Fragrances — Admin Panel</p>
  </header>


  <!-- LOGIN -->

  <div id="loginBox" class="card">

    <h2>🔐 تسجيل دخول الإدارة</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      دخول
    </button>

    <p id="loginMessage" class="message"></p>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel">


    <!-- ADD -->

    <div class="card">

      <h2>✨ إضافة عطر جديد</h2>

      <input
        id="productName"
        type="text"
        placeholder="اسم العطر"
      >

      <input
        id="productPrice"
        type="number"
        placeholder="السعر"
      >

      <textarea
        id="productDescription"
        placeholder="وصف العطر"
      ></textarea>

      <input
        id="productStock"
        type="number"
        placeholder="المخزون"
      >

      <select id="productCategory">

        <option value="">
          اختر القسم
        </option>

        <option value="man">
          MAN
        </option>

        <option value="women">
          WOMEN
        </option>

        <option value="unisex">
          UNISEX
        </option>

      </select>

      <input
        id="productImage"
        type="file"
        accept="image/*"
      >

      <button class="gold" onclick="addProduct()">
        ✨ إضافة العطر
      </button>

      <p id="addMessage" class="message"></p>

    </div>


    <!-- PRODUCTS -->

    <div class="card">

      <h2>🌹 إدارة العطور</h2>

      <div class="toolbar">

        <input
          id="searchInput"
          type="text"
          placeholder="🔎 ابحث عن عطر..."
          oninput="renderProducts()"
        >

        <select
          id="filterCategory"
          onchange="renderProducts()"
        >

          <option value="all">
            كل الأقسام
          </option>

          <option value="man">
            MAN
          </option>

          <option value="women">
            WOMEN
          </option>

          <option value="unisex">
            UNISEX
          </option>

        </select>

      </div>

      <div id="count" class="count"></div>

      <div id="products" class="products">

        <div class="empty">
          جاري تحميل العطور...
        </div>

      </div>

    </div>


    <button class="logout" onclick="logout()">
      تسجيل خروج
    </button>

  </div>

</div>


<script>


/* ==========================
   SUPABASE
========================== */

const SUPABASE_URL =
  "https://frvgjkeeaojyvwsjikre.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aPftd5l28afljdgY2ddn9A_2HPnFF3E";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================
   DATA
========================== */

let products = [];


/* ==========================
   LOGIN
========================== */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "اكتب الإيميل والباسورد",
      "error"
    );

    return;
  }

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;
  }

  showAdmin();

  loadProducts();
}


/* ==========================
   SHOW ADMIN
========================== */

function showAdmin() {

  document.getElementById("loginBox").style.display =
    "none";

  document.getElementById("adminPanel").style.display =
    "block";
}


/* ==========================
   LOGOUT
========================== */

async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel").style.display =
    "none";

  document.getElementById("loginBox").style.display =
    "block";
}


/* ==========================
   ADD PRODUCT
========================== */

async function addProduct() {

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value;

  const description =
    document.getElementById("productDescription").value.trim();

  const stock =
    document.getElementById("productStock").value;

  const category =
    document.getElementById("productCategory").value;

  const imageFile =
    document.getElementById("productImage").files[0];

  if (!name || !price || !category || !imageFile) {

    showMessage(
      "addMessage",
      "اكتب الاسم والسعر والقسم واختار صورة",
      "error"
    );

    return;
  }

  showMessage(
    "addMessage",
    "جاري إضافة العطر...",
    ""
  );


  /* UPLOAD IMAGE */

  const safeName =
    imageFile.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "-"
    );

  const fileName =
    Date.now() + "-" + safeName;

  const { error: uploadError } =
    await supabaseClient.storage
      .from("product-images")
      .upload(
        fileName,
        imageFile
      );

  if (uploadError) {

    showMessage(
      "addMessage",
      uploadError.message,
      "error"
    );

    return;
  }


  /* IMAGE URL */

  const { data: publicData } =
    supabaseClient.storage
      .from("product-images")
      .getPublicUrl(fileName);

  const imageUrl =
    publicData.publicUrl;


  /* INSERT */

  const { error } =
    await supabaseClient
      .from("products")
      .insert({

        name: name,

        price: Number(price),

        image: imageUrl,

        description: description,

        stock: Number(stock || 0),

        category: category

      });


  if (error) {

    showMessage(
      "addMessage",
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "addMessage",
    "تم إضافة العطر بنجاح ✅",
    "success"
  );


  clearAddForm();

  loadProducts();
}


/* ==========================
   CLEAR FORM
========================== */

function clearAddForm() {

  document.getElementById("productName").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productDescription").value = "";

  document.getElementById("productStock").value = "";

  document.getElementById("productCategory").value = "";

  document.getElementById("productImage").value = "";
}


/* ==========================
   LOAD PRODUCTS
========================== */

async function loadProducts() {

  const container =
    document.getElementById("products");

  container.innerHTML =
    '<div class="empty">جاري تحميل العطور...</div>';


  const { data, error } =
    await supabaseClient
      .from("products")
      .select(
        "product_id,name,price,image,description,stock,category"
      );


  if (error) {

    container.innerHTML = `
      <div class="empty">
        ❌ حدث خطأ في تحميل العطور
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }


  products = data || [];

  renderProducts();
}


/* ==========================
   FILTER + SEARCH
========================== */

function getFilteredProducts() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const category =
    document
      .getElementById("filterCategory")
      .value;


  return products.filter(product => {

    const matchesSearch =
      !search ||
      String(product.name || "")
        .toLowerCase()
        .includes(search);


    const matchesCategory =
      category === "all" ||
      product.category === category;


    return (
      matchesSearch &&
      matchesCategory
    );

  });
}


/* ==========================
   RENDER
========================== */

function renderProducts() {

  const container =
    document.getElementById("products");

  const filtered =
    getFilteredProducts();


  document.getElementById("count").textContent =
    `عدد العطور الظاهرة: ${filtered.length} من ${products.length}`;


  if (!filtered.length) {

    container.innerHTML = `
      <div class="empty">
        لا توجد عطور مطابقة للبحث.
      </div>
    `;

    return;
  }


  container.innerHTML =
    filtered.map(product => {

      const category =
        getCategoryName(product.category);


      return `

        <div class="product">

          <img
            src="${escapeAttribute(product.image || "")}"
            alt=""
            onerror="this.style.opacity='.3'"
          >


          <div>

            <div class="product-name">
              ${escapeHTML(product.name || "")}
            </div>


            <div class="product-info">

              💰 السعر:
              <strong>
                ${Number(product.price || 0).toLocaleString("ar-EG")}
              </strong>
              جنيه

              <br>

              📦 المخزون:
              ${Number(product.stock || 0)}

              <br>

              🏷️ القسم:
              <span class="category">
                ${escapeHTML(category)}
              </span>

            </div>


            <div class="actions">

              <button
                class="gold"
                onclick="openEdit('${product.product_id}')"
              >
                ✏️ تعديل
              </button>


              <button
                class="red"
                onclick="deleteProduct('${product.product_id}')"
              >
                🗑️ حذف
              </button>

            </div>


            <div
              id="edit-${product.product_id}"
              class="edit-box"
            >

              <input
                id="name-${product.product_id}"
                value="${escapeAttribute(product.name || "")}"
                placeholder="اسم العطر"
              >


              <input
                id="price-${product.product_id}"
                type="number"
                value="${escapeAttribute(product.price || 0)}"
                placeholder="السعر"
              >


              <textarea
                id="description-${product.product_id}"
                placeholder="الوصف"
              >${escapeHTML(product.description || "")}</textarea>


              <input
                id="stock-${product.product_id}"
                type="number"
                value="${escapeAttribute(product.stock || 0)}"
                placeholder="المخزون"
              >


              <select
                id="category-${product.product_id}"
              >

                <option
                  value="man"
                  ${product.category === "man" ? "selected" : ""}
                >
                  MAN
                </option>

                <option
                  value="women"
                  ${product.category === "women" ? "selected" : ""}
                >
                  WOMEN
                </option>

                <option
                  value="unisex"
                  ${product.category === "unisex" ? "selected" : ""}
                >
                  UNISEX
                </option>

              </select>


              <input
                id="image-${product.product_id}"
                type="file"
                accept="image/*"
              >


              <button
                class="gold"
                onclick="updateProduct('${product.product_id}')"
              >
                💾 حفظ التعديلات
              </button>


              <button
                class="gray"
                onclick="openEdit('${product.product_id}')"
              >
                إلغاء
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* ==========================
   OPEN EDIT
========================== */

function openEdit(id) {

  const box =
    document.getElementById(
      "edit-" + id
    );

  if (!box) return;

  box.classList.toggle("show");
}


/* ==========================
   UPDATE
========================== */

async function updateProduct(id) {

  const product =
    products.find(
      p => p.product_id === id
    );


  if (!product) {

    alert("العطر غير موجود");

    return;
  }


  const name =
    document.getElementById(
      "name-" + id
    ).value.trim();


  const price =
    document.getElementById(
      "price-" + id
    ).value;


  const description =
    document.getElementById(
      "description-" + id
    ).value.trim();


  const stock =
    document.getElementById(
      "stock-" + id
    ).value;


  const category =
    document.getElementById(
      "category-" + id
    ).value;


  const imageFile =
    document.getElementById(
      "image-" + id
    ).files[0];


  if (!name || !price || !category) {

    alert(
      "اكتب الاسم والسعر والقسم"
    );

    return;
  }


  let image =
    product.image;


  /* NEW IMAGE */

  if (imageFile) {

    const safeName =
      imageFile.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "-"
      );


    const fileName =
      Date.now() + "-" + safeName;


    const { error } =
      await supabaseClient.storage
        .from("product-images")
        .upload(
          fileName,
          imageFile
        );


    if (error) {

      alert(error.message);

      return;
    }


    const { data } =
      supabaseClient.storage
        .from("product-images")
        .getPublicUrl(
          fileName
        );


    image =
      data.publicUrl;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .update({

        name: name,

        price: Number(price),

        image: image,

        description: description,

        stock: Number(stock || 0),

        category: category

      })
      .eq(
        "product_id",
        id
      );


  if (error) {

    alert(
      "حدث خطأ أثناء التعديل:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "تم تعديل العطر بنجاح ✅"
  );


  loadProducts();
}


/* ==========================
   DELETE
========================== */

async function deleteProduct(id) {

  const product =
    products.find(
      p => p.product_id === id
    );


  if (!product) {

    alert("العطر غير موجود");

    return;
  }


  const confirmed =
    confirm(
      "هل أنت متأكد من حذف:\n\n" +
      product.name +
      "\n\nلا يمكن التراجع عن الحذف."
    );


  if (!confirmed) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq(
        "product_id",
        id
      );


  if (error) {

    alert(
      "حدث خطأ أثناء الحذف:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "تم حذف العطر بنجاح 🗑️"
  );


  loadProducts();
}


/* ==========================
   CATEGORY
========================== */

function getCategoryName(category) {

  if (category === "man") return "MAN";

  if (category === "women") return "WOMEN";

  if (category === "unisex") return "UNISEX";

  return category || "غير محدد";
}


/* ==========================
   MESSAGES
========================== */

function showMessage(
  id,
  text,
  type
) {

  const element =
    document.getElementById(id);

  element.textContent = text;

  element.className =
    "message " + type;
}


/* ==========================
   ESCAPE
========================== */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

  return escapeHTML(value);
}


/* ==========================
   SESSION
========================== */

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    showAdmin();

    loadProducts();
  }
}


checkSession();

</script>

</body>
</html>
