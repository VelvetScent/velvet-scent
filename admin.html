<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Velvet Scent - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #171513;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 30px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand {
      text-align: center;
      font-size: 14px;
      letter-spacing: 4px;
      color: #b08a43;
      margin-bottom: 8px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    button {
      cursor: pointer;
      background: #171513;
      color: white;
      border: none;
    }

    button:hover {
      opacity: .88;
    }

    .category-select {
      background: white;
    }

    .product {
      display: flex;
      gap: 15px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 18px 0;
    }

    .product:last-child {
      border-bottom: none;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .category {
      display: inline-block;
      background: #171513;
      color: white;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 5px;
    }

    .delete {
      background: #b00000;
      width: auto;
      padding: 9px 15px;
    }

    .logout {
      background: #555;
    }

    #adminPanel {
      display: none;
    }

    #message,
    #loginMessage {
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .product {
        align-items: flex-start;
      }

      .product img {
        width: 70px;
        height: 70px;
      }

      .product-info {
        min-width: 0;
      }

      .product-name {
        font-size: 15px;
      }

      .delete {
        font-size: 12px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    VELVET SCENT
  </div>

  <h1>
    لوحة تحكم المتجر
  </h1>


  <!-- LOGIN -->

  <div
    id="loginBox"
    class="card"
  >

    <h2>
      🔐 تسجيل دخول الإدارة
    </h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      دخول
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel">


    <!-- ADD PRODUCT -->

    <div class="card">

      <h2>
        ✨ إضافة عطر جديد
      </h2>


      <input
        id="productName"
        placeholder="اسم العطر"
      >


      <input
        id="productPrice"
        type="number"
        placeholder="السعر بالجنيه"
      >


      <textarea
        id="productDescription"
        placeholder="وصف العطر"
      ></textarea>


      <!-- CATEGORY -->

      <label>
        القسم
      </label>

      <select
        id="productCategory"
        class="category-select"
      >

        <option value="man">
          👔 MAN
        </option>

        <option value="women">
          🌸 WOMEN
        </option>

        <option value="unisex">
          ✨ UNISEX
        </option>

      </select>


      <input
        id="productStock"
        type="number"
        placeholder="المخزون"
        value="10"
      >


      <label>
        صورة العطر
      </label>

      <input
        id="productImage"
        type="file"
        accept="image/*"
      >


      <button onclick="addProduct()">
        ➕ إضافة العطر
      </button>


      <p id="message"></p>

    </div>


    <!-- PRODUCTS -->

    <div class="card">

      <h2>
        🧴 العطور الموجودة
      </h2>

      <div id="products">

        <div class="empty">
          جاري تحميل العطور...
        </div>

      </div>

    </div>


    <button
      class="logout"
      onclick="logout()"
    >
      تسجيل خروج
    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://frvgjkeeaojyvwsjikre.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_aPftd5l28afljdgY2ddn9A_2HPnFF3E";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const BUCKET =
  "product-images";


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    document
      .getElementById(
        "loginMessage"
      )
      .textContent =
        "اكتب الإيميل والباسورد";

    return;
  }


  const { error } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


  if (error) {

    document
      .getElementById(
        "loginMessage"
      )
      .textContent =
        error.message;

    return;
  }


  showAdmin();

  loadProducts();

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin() {

  document
    .getElementById(
      "loginBox"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "adminPanel"
    )
    .style.display =
      "block";

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth
    .signOut();


  document
    .getElementById(
      "adminPanel"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "loginBox"
    )
    .style.display =
      "block";

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct() {

  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const price =
    document
      .getElementById(
        "productPrice"
      )
      .value;


  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value;


  const stock =
    document
      .getElementById(
        "productStock"
      )
      .value;


  const imageFile =
    document
      .getElementById(
        "productImage"
      )
      .files[0];


  if (
    !name ||
    !price ||
    !imageFile
  ) {

    alert(
      "اكتب اسم العطر والسعر واختار صورة"
    );

    return;
  }


  const extension =
    imageFile.name
      .split(".")
      .pop();


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  /* UPLOAD IMAGE */

  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .upload(
        fileName,
        imageFile
      );


  if (uploadError) {

    alert(
      "خطأ في رفع الصورة: " +
      uploadError.message
    );

    return;
  }


  /* GET IMAGE URL */

  const {
    data:
      publicUrlData
  } =
    supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(
        fileName
      );


  const imageUrl =
    publicUrlData.publicUrl;


  /* INSERT PRODUCT */

  const {
    error
  } =
    await supabaseClient
      .from("products")
      .insert({

        name: name,

        price: Number(
          price
        ),

        image: imageUrl,

        description:
          description,

        stock: Number(
          stock || 0
        ),

        category:
          category

      });


  if (error) {

    alert(
      "خطأ في إضافة العطر: " +
      error.message
    );

    return;
  }


  document
    .getElementById(
      "message"
    )
    .textContent =
      "تم إضافة العطر بنجاح ✅";


  /* CLEAR */

  document
    .getElementById(
      "productName"
    )
    .value = "";


  document
    .getElementById(
      "productPrice"
    )
    .value = "";


  document
    .getElementById(
      "productDescription"
    )
    .value = "";


  document
    .getElementById(
      "productStock"
    )
    .value = "10";


  document
    .getElementById(
      "productImage"
    )
    .value = "";


  document
    .getElementById(
      "productCategory"
    )
    .value =
      "man";


  loadProducts();

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const container =
    document.getElementById(
      "products"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML =
      `
      <div class="empty">
        ${escapeHTML(
          error.message
        )}
      </div>
      `;

    return;
  }


  if (!data || !data.length) {

    container.innerHTML =
      `
      <div class="empty">
        لا توجد عطور حاليًا
      </div>
      `;

    return;
  }


  container.innerHTML =
    data
      .map(
        product => {

          const categoryName =
            getCategoryName(
              product.category
            );


          return `

          <div class="product">

            <img
              src="${escapeHTML(
                product.image || ""
              )}"
              alt=""
            >


            <div class="product-info">

              <div class="product-name">

                ${escapeHTML(
                  product.name
                )}

              </div>


              السعر:

              ${Number(
                product.price
              ).toLocaleString(
                "ar-EG"
              )}

              جنيه

              <br>


              المخزون:

              ${Number(
                product.stock || 0
              )}


              <br>


              <span class="category">

                ${categoryName}

              </span>

            </div>


            <button
              class="delete"
              onclick="
                deleteProduct(
                  ${product.id}
                )
              "
            >
              حذف
            </button>

          </div>

          `;

        }
      )
      .join("");

}


/* =========================
   CATEGORY NAME
========================= */

function getCategoryName(
  category
) {

  if (
    category === "man"
  ) {
    return "MAN";
  }


  if (
    category === "women"
  ) {
    return "WOMEN";
  }


  if (
    category === "unisex"
  ) {
    return "UNISEX";
  }


  return "UNISEX";

}


/* =========================
   DELETE
========================= */

async function deleteProduct(
  id
) {

  const confirmed =
    confirm(
      "متأكد إنك عاوز تحذف العطر؟"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "خطأ في الحذف: " +
      error.message
    );

    return;
  }


  loadProducts();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    data &&
    data.session
  ) {

    showAdmin();

    loadProducts();

  }

}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
